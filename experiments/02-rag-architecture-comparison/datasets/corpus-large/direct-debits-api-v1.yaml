openapi: 3.1.0
info:
  title: Lab Bank Direct Debits API (v1)
  version: 1.0.0
  description: Controls the mandates that let a creditor collect payments. This is version 1 of the Direct Debits API. The scopes are direct-debits:read and direct-debits:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Direct Debits
  description: Operations on direct debits.
paths:
  /v1/direct-debits:
    get:
      operationId: listDirectDebits
      summary: List direct debits
      description: Returns a page of direct debits, newest first. Use `pageSize` to choose how many come back, up to 100, and `pageToken` to fetch the next page.
      tags:
      - Direct Debits
      security:
      - bearerAuth:
        - direct-debits:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of direct debits to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return direct debits in this state.
        schema:
          type: string
          enum:
          - pending
          - active
          - suspended
          - cancelled
      responses:
        '200':
          description: A page of direct debits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-DDB-001` when the direct debit request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DDB-003` when the customer is not allowed to use this direct debit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createDirectDebit
      summary: Create a direct debit
      description: Creates a direct debit for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second direct debit.
      tags:
      - Direct Debits
      security:
      - bearerAuth:
        - direct-debits:write
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The direct debit to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectDebitCreate'
      responses:
        '201':
          description: The direct debit was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebit'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-DDB-001` when the direct debit request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DDB-003` when the customer is not allowed to use this direct debit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the direct debit. The Problem `code` is `ERR-DDB-008` when the direct debit is suspended; or `ERR-DDB-010` when the direct debit is lapsed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-DDB-012` when the collection is above the monthly limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/direct-debits/{directDebitId}:
    get:
      operationId: getDirectDebit
      summary: Get a direct debit
      description: Returns one direct debit by its identifier, with its current state and every field described in the DirectDebit schema.
      tags:
      - Direct Debits
      security:
      - bearerAuth:
        - direct-debits:read
        apiKey: []
      parameters:
      - name: directDebitId
        in: path
        required: true
        description: Identifier of the direct debit.
        schema:
          type: string
      responses:
        '200':
          description: The direct debit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebit'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DDB-004` when the application is not allowed to use this direct debit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The direct debit was not found. The Problem `code` is `ERR-DDB-005` when no direct debit exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/direct-debits/{directDebitId}/suspend:
    post:
      operationId: suspendDirectDebit
      summary: Suspend a direct debit
      description: Stops the creditor from collecting payments until the mandate is reinstated.
      tags:
      - Direct Debits
      security:
      - bearerAuth:
        - direct-debits:write
        apiKey: []
      parameters:
      - name: directDebitId
        in: path
        required: true
        description: Identifier of the direct debit.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to suspend a direct debit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendDirectDebitRequest'
      responses:
        '200':
          description: The action was applied and the direct debit is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebit'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-DDB-002` when the direct debit request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DDB-003` when the customer is not allowed to use this direct debit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The direct debit was not found. The Problem `code` is `ERR-DDB-006` when the direct debit belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the direct debit. The Problem `code` is `ERR-DDB-007` when the direct debit is pending; or `ERR-DDB-009` when the direct debit is cancelled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-DDB-011` when the collection is above the single limit; or `ERR-DDB-013` when the collection is above the annual limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Direct Debits API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            direct-debits:read: Read direct debits and their current state.
            direct-debits:write: Create, change and close direct debits.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    DirectDebit:
      type: object
      description: A direct debit.
      required:
      - id
      - status
      - creditorName
      properties:
        id:
          type: string
          description: Identifier of the direct debit.
        status:
          type: string
          enum:
          - pending
          - active
          - suspended
          - cancelled
          description: Lifecycle state of the mandate.
        creditorName:
          type: string
          description: Name of the company collecting the payments.
        reference:
          type: string
          description: Unique mandate reference.
        limit:
          type: number
          minimum: 0
          maximum: 10000
          description: Largest amount that may be collected in one go.
        expiresOn:
          type: string
          format: date
          description: Date on which the mandate lapses if it is not used.
    DirectDebitList:
      type: object
      description: A page of direct debits.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DirectDebit'
          description: The direct debits on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    DirectDebitCreate:
      type: object
      description: Fields of a new direct debit.
      required:
      - creditorName
      - reference
      properties:
        creditorName:
          type: string
          description: Name of the company collecting the payments.
        reference:
          type: string
          description: Unique mandate reference.
        limit:
          type: number
          minimum: 0
          maximum: 10000
          description: Largest amount that may be collected in one go.
        expiresOn:
          type: string
          format: date
          description: Date on which the mandate lapses if it is not used.
    SuspendDirectDebitRequest:
      type: object
      description: Details of the request to suspend a direct debit.
      required:
      - reason
      properties:
        reason:
          type: string
          description: Why the mandate is suspended.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-DDB-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
