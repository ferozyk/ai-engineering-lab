openapi: 3.1.0
info:
  title: Lab Bank Standing Orders API (v1)
  version: 1.0.0
  description: Schedules recurring payments from a current account. This is version 1 of the Standing Orders API. The scopes are standing-orders:read and standing-orders:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Standing Orders
  description: Operations on standing orders.
paths:
  /v1/standing-orders:
    get:
      operationId: listStandingOrders
      summary: List standing orders
      description: Returns a page of standing orders, newest first. Use `pageSize` to choose how many come back, up to 25, and `pageToken` to fetch the next page.
      tags:
      - Standing Orders
      security:
      - bearerAuth:
        - standing-orders:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of standing orders to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 25
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return standing orders in this state.
        schema:
          type: string
          enum:
          - active
          - paused
          - cancelled
          - completed
      responses:
        '200':
          description: A page of standing orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrderList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-STO-001` when the standing order request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-STO-003` when the customer is not allowed to use this standing order.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/standing-orders/{standingOrderId}:
    get:
      operationId: getStandingOrder
      summary: Get a standing order
      description: Returns one standing order by its identifier, with its current state and every field described in the StandingOrder schema.
      tags:
      - Standing Orders
      security:
      - bearerAuth:
        - standing-orders:read
        apiKey: []
      parameters:
      - name: standingOrderId
        in: path
        required: true
        description: Identifier of the standing order.
        schema:
          type: string
      responses:
        '200':
          description: The standing order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrder'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-STO-004` when the application is not allowed to use this standing order.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The standing order was not found. The Problem `code` is `ERR-STO-005` when no standing order exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/standing-orders/{standingOrderId}/pause:
    post:
      operationId: pauseStandingOrder
      summary: Pause a standing order
      description: Skips the scheduled runs until the standing order is resumed.
      tags:
      - Standing Orders
      security:
      - bearerAuth:
        - standing-orders:write
        apiKey: []
      parameters:
      - name: standingOrderId
        in: path
        required: true
        description: Identifier of the standing order.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to pause a standing order.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PauseStandingOrderRequest'
      responses:
        '200':
          description: The action was applied and the standing order is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandingOrder'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-STO-002` when the standing order request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-STO-003` when the customer is not allowed to use this standing order.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The standing order was not found. The Problem `code` is `ERR-STO-006` when the standing order belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the standing order. The Problem `code` is `ERR-STO-007` when the standing order is paused; `ERR-STO-008` when the standing order is cancelled; `ERR-STO-009` when the standing order is completed; or `ERR-STO-010` when the standing order is failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-STO-011` when the payment is above the daily limit; `ERR-STO-012` when the payment is above the monthly limit; or `ERR-STO-013` when the payment is above the per-run limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Standing Orders API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            standing-orders:read: Read standing orders and their current state.
            standing-orders:write: Create, change and close standing orders.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    StandingOrder:
      type: object
      description: A standing order.
      required:
      - id
      - status
      - amount
      properties:
        id:
          type: string
          description: Identifier of the standing order.
        status:
          type: string
          enum:
          - active
          - paused
          - cancelled
          - completed
          description: Lifecycle state of the standing order.
        amount:
          type: number
          minimum: 0
          maximum: 100000
          description: Amount paid on every run.
        frequency:
          type: string
          enum:
          - weekly
          - monthly
          - quarterly
          description: How often the payment is made.
        nextRunDate:
          type: string
          format: date
          description: Date of the next payment.
        reference:
          type: string
          description: Reference shown on the payee's statement.
    StandingOrderList:
      type: object
      description: A page of standing orders.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StandingOrder'
          description: The standing orders on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    PauseStandingOrderRequest:
      type: object
      description: Details of the request to pause a standing order.
      required:
      - resumeOn
      properties:
        resumeOn:
          type: string
          format: date
          description: Date on which the runs start again.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-STO-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
