openapi: 3.1.0
info:
  title: Lab Bank Documents API (v1)
  version: 1.0.0
  description: Stores the documents a customer has provided or received. This is version 1 of the Documents API. The scopes are documents:read and documents:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Documents
  description: Operations on documents.
paths:
  /v1/documents:
    get:
      operationId: listDocuments
      summary: List documents
      description: Returns a page of documents, newest first. Use `pageSize` to choose how many come back, up to 50, and `pageToken` to fetch the next page.
      tags:
      - Documents
      security:
      - bearerAuth:
        - documents:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of documents to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return documents in this state.
        schema:
          type: string
          enum:
          - uploaded
          - verified
          - rejected
          - archived
      responses:
        '200':
          description: A page of documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-DOC-001` when the document request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DOC-003` when the customer is not allowed to use this document.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/documents/{documentId}:
    get:
      operationId: getDocument
      summary: Get a document
      description: Returns one document by its identifier, with its current state and every field described in the Document schema.
      tags:
      - Documents
      security:
      - bearerAuth:
        - documents:read
        apiKey: []
      parameters:
      - name: documentId
        in: path
        required: true
        description: Identifier of the document.
        schema:
          type: string
      responses:
        '200':
          description: The document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DOC-004` when the application is not allowed to use this document.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The document was not found. The Problem `code` is `ERR-DOC-005` when no document exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/documents/{documentId}/archive:
    post:
      operationId: archiveDocument
      summary: Archive a document
      description: Moves the document to long-term storage where it stays readable but cannot be changed.
      tags:
      - Documents
      security:
      - bearerAuth:
        - documents:write
        apiKey: []
      parameters:
      - name: documentId
        in: path
        required: true
        description: Identifier of the document.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to archive a document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveDocumentRequest'
      responses:
        '200':
          description: The action was applied and the document is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-DOC-002` when the document request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DOC-003` when the customer is not allowed to use this document.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The document was not found. The Problem `code` is `ERR-DOC-006` when the document belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the document. The Problem `code` is `ERR-DOC-007` when the document is uploaded; `ERR-DOC-008` when the document is rejected; `ERR-DOC-009` when the document is archived; or `ERR-DOC-010` when the document is quarantined.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-DOC-011` when the upload is above the daily limit; `ERR-DOC-012` when the upload is above the per-file limit; or `ERR-DOC-013` when the upload is above the total limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Documents API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            documents:read: Read documents and their current state.
            documents:write: Create, change and close documents.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Document:
      type: object
      description: A document.
      required:
      - id
      - status
      - fileName
      properties:
        id:
          type: string
          description: Identifier of the document.
        status:
          type: string
          enum:
          - uploaded
          - verified
          - rejected
          - archived
          description: Review state of the document.
        fileName:
          type: string
          description: Original name of the uploaded file.
        sizeBytes:
          type: integer
          minimum: 0
          description: Size of the file in bytes.
        reference:
          type: string
          description: Reference printed on the document.
        expiresOn:
          type: string
          format: date
          description: Date after which a new copy must be uploaded.
    DocumentList:
      type: object
      description: A page of documents.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
          description: The documents on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    ArchiveDocumentRequest:
      type: object
      description: Details of the request to archive a document.
      required:
      - retentionYears
      properties:
        retentionYears:
          type: integer
          minimum: 0
          description: Years the archived copy is kept.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-DOC-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
