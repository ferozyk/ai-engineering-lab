openapi: 3.1.0
info:
  title: Lab Bank Disputes API (v1)
  version: 1.0.0
  description: Records customer disputes about card transactions. This is version 1 of the Disputes API. The scopes are disputes:read and disputes:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Disputes
  description: Operations on disputes.
paths:
  /v1/disputes:
    get:
      operationId: listDisputes
      summary: List disputes
      description: Returns a page of disputes, newest first. Use `pageSize` to choose how many come back, up to 50, and `pageToken` to fetch the next page.
      tags:
      - Disputes
      security:
      - bearerAuth:
        - disputes:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of disputes to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return disputes in this state.
        schema:
          type: string
          enum:
          - opened
          - under_review
          - escalated
          - resolved
      responses:
        '200':
          description: A page of disputes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-DSP-001` when the dispute request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DSP-003` when the customer is not allowed to use this dispute.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createDispute
      summary: Create a dispute
      description: Creates a dispute for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second dispute.
      tags:
      - Disputes
      security:
      - bearerAuth:
        - disputes:write
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The dispute to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeCreate'
      responses:
        '201':
          description: The dispute was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-DSP-001` when the dispute request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DSP-003` when the customer is not allowed to use this dispute.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the dispute. The Problem `code` is `ERR-DSP-008` when the dispute is escalated; or `ERR-DSP-010` when the dispute is withdrawn.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-DSP-012` when the claim is above the monthly limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/disputes/{disputeId}:
    get:
      operationId: getDispute
      summary: Get a dispute
      description: Returns one dispute by its identifier, with its current state and every field described in the Dispute schema.
      tags:
      - Disputes
      security:
      - bearerAuth:
        - disputes:read
        apiKey: []
      parameters:
      - name: disputeId
        in: path
        required: true
        description: Identifier of the dispute.
        schema:
          type: string
      responses:
        '200':
          description: The dispute.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DSP-004` when the application is not allowed to use this dispute.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The dispute was not found. The Problem `code` is `ERR-DSP-005` when no dispute exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/disputes/{disputeId}/escalate:
    post:
      operationId: escalateDispute
      summary: Escalate a dispute
      description: Moves the dispute to the specialist review team when the first review did not settle it.
      tags:
      - Disputes
      security:
      - bearerAuth:
        - disputes:write
        apiKey: []
      parameters:
      - name: disputeId
        in: path
        required: true
        description: Identifier of the dispute.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to escalate a dispute.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalateDisputeRequest'
      responses:
        '200':
          description: The action was applied and the dispute is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dispute'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-DSP-002` when the dispute request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-DSP-003` when the customer is not allowed to use this dispute.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The dispute was not found. The Problem `code` is `ERR-DSP-006` when the dispute belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the dispute. The Problem `code` is `ERR-DSP-007` when the dispute is under review; or `ERR-DSP-009` when the dispute is resolved.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-DSP-011` when the claim is above the per-case limit; or `ERR-DSP-013` when the claim is above the annual limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Disputes API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            disputes:read: Read disputes and their current state.
            disputes:write: Create, change and close disputes.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Dispute:
      type: object
      description: A dispute.
      required:
      - id
      - status
      - amount
      properties:
        id:
          type: string
          description: Identifier of the dispute.
        status:
          type: string
          enum:
          - opened
          - under_review
          - escalated
          - resolved
          description: Lifecycle state of the dispute.
        amount:
          type: number
          minimum: 0
          maximum: 50000
          description: Disputed amount.
        reason:
          type: string
          enum:
          - not_received
          - duplicate
          - incorrect_amount
          - unrecognised
          description: Why the transaction is disputed.
        reference:
          type: string
          description: Merchant reference of the disputed transaction.
        openedOn:
          type: string
          format: date
          description: Date on which the dispute was opened.
    DisputeList:
      type: object
      description: A page of disputes.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Dispute'
          description: The disputes on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    DisputeCreate:
      type: object
      description: Fields of a new dispute.
      required:
      - amount
      - reason
      properties:
        amount:
          type: number
          minimum: 0
          maximum: 50000
          description: Disputed amount.
        reason:
          type: string
          enum:
          - not_received
          - duplicate
          - incorrect_amount
          - unrecognised
          description: Why the transaction is disputed.
        reference:
          type: string
          description: Merchant reference of the disputed transaction.
        openedOn:
          type: string
          format: date
          description: Date on which the dispute was opened.
    EscalateDisputeRequest:
      type: object
      description: Details of the request to escalate a dispute.
      required:
      - note
      properties:
        note:
          type: string
          description: Explanation for the reviewer.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-DSP-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
