openapi: 3.1.0
info:
  title: Lab Bank Savings Goals API (v2)
  version: 2.0.0
  description: Lets customers set aside money towards a target. This is version 2 of the Savings Goals API. The scopes are savings-goals:read and savings-goals:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Savings Goals
  description: Operations on savings goals.
paths:
  /v2/savings-goals:
    get:
      operationId: listSavingsGoals
      summary: List savings goals
      description: Returns a page of savings goals, newest first. Use `pageSize` to choose how many come back, up to 100, and `pageToken` to fetch the next page.
      tags:
      - Savings Goals
      security:
      - bearerAuth:
        - savings-goals:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of savings goals to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return savings goals in this state.
        schema:
          type: string
          enum:
          - active
          - paused
          - reached
          - closed
      responses:
        '200':
          description: A page of savings goals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoalList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-SVG-001` when the savings goal request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-SVG-003` when the customer is not allowed to use this savings goal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createSavingsGoal
      summary: Create a savings goal
      description: Creates a savings goal for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second savings goal.
      tags:
      - Savings Goals
      security:
      - bearerAuth:
        - savings-goals:write
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The savings goal to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavingsGoalCreate'
      responses:
        '201':
          description: The savings goal was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoal'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-SVG-001` when the savings goal request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-SVG-003` when the customer is not allowed to use this savings goal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the savings goal. The Problem `code` is `ERR-SVG-008` when the savings goal is reached; or `ERR-SVG-010` when the savings goal is locked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-SVG-012` when the top-up is above the monthly limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/savings-goals/{savingsGoalId}:
    get:
      operationId: getSavingsGoal
      summary: Get a savings goal
      description: Returns one savings goal by its identifier, with its current state and every field described in the SavingsGoal schema.
      tags:
      - Savings Goals
      security:
      - bearerAuth:
        - savings-goals:read
        apiKey: []
      parameters:
      - name: savingsGoalId
        in: path
        required: true
        description: Identifier of the savings goal.
        schema:
          type: string
      responses:
        '200':
          description: The savings goal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoal'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-SVG-004` when the application is not allowed to use this savings goal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The savings goal was not found. The Problem `code` is `ERR-SVG-005` when no savings goal exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/savings-goals/{savingsGoalId}/fund:
    post:
      operationId: fundSavingsGoal
      summary: Fund a savings goal
      description: Moves money from a current account into the savings goal.
      tags:
      - Savings Goals
      security:
      - bearerAuth:
        - savings-goals:write
        apiKey: []
      parameters:
      - name: savingsGoalId
        in: path
        required: true
        description: Identifier of the savings goal.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to fund a savings goal.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundSavingsGoalRequest'
      responses:
        '200':
          description: The action was applied and the savings goal is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoal'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-SVG-002` when the savings goal request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-SVG-003` when the customer is not allowed to use this savings goal.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The savings goal was not found. The Problem `code` is `ERR-SVG-006` when the savings goal belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the savings goal. The Problem `code` is `ERR-SVG-007` when the savings goal is paused; or `ERR-SVG-009` when the savings goal is closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-SVG-011` when the top-up is above the daily limit; or `ERR-SVG-013` when the top-up is above the single limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Savings Goals API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            savings-goals:read: Read savings goals and their current state.
            savings-goals:write: Create, change and close savings goals.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    SavingsGoal:
      type: object
      description: A savings goal.
      required:
      - id
      - status
      - targetAmount
      properties:
        id:
          type: string
          description: Identifier of the savings goal.
        status:
          type: string
          enum:
          - active
          - paused
          - reached
          - closed
          description: State of the savings goal.
        targetAmount:
          type: number
          minimum: 0
          maximum: 10000000
          description: Amount the customer wants to save.
        deadline:
          type: string
          format: date
          description: Date by which the target should be reached.
        reference:
          type: string
          description: Name the customer gave the goal.
        limit:
          type: number
          minimum: 0
          maximum: 100000
          description: Largest single top-up.
    SavingsGoalList:
      type: object
      description: A page of savings goals.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavingsGoal'
          description: The savings goals on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    SavingsGoalCreate:
      type: object
      description: Fields of a new savings goal.
      required:
      - targetAmount
      - deadline
      properties:
        targetAmount:
          type: number
          minimum: 0
          maximum: 10000000
          description: Amount the customer wants to save.
        deadline:
          type: string
          format: date
          description: Date by which the target should be reached.
        reference:
          type: string
          description: Name the customer gave the goal.
        limit:
          type: number
          minimum: 0
          maximum: 100000
          description: Largest single top-up.
    FundSavingsGoalRequest:
      type: object
      description: Details of the request to fund a savings goal.
      required:
      - amount
      properties:
        amount:
          type: number
          minimum: 0
          maximum: 100000
          description: Amount to move.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-SVG-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
