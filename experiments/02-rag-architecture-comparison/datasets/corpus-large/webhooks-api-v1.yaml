openapi: 3.1.0
info:
  title: Lab Bank Webhooks API (v1)
  version: 1.0.0
  description: Delivers event notifications to the endpoints of partner applications. This is version 1 of the Webhooks API. The scopes are webhooks:read and webhooks:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Webhooks
  description: Operations on webhooks.
paths:
  /v1/webhooks:
    get:
      operationId: listWebhooks
      summary: List webhooks
      description: Returns a page of webhooks, newest first. Use `pageSize` to choose how many come back, up to 25, and `pageToken` to fetch the next page.
      tags:
      - Webhooks
      security:
      - bearerAuth:
        - webhooks:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of webhooks to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 25
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return webhooks in this state.
        schema:
          type: string
          enum:
          - active
          - paused
          - failing
          - deleted
      responses:
        '200':
          description: A page of webhooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-WHK-001` when the webhook request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-WHK-003` when the customer is not allowed to use this webhook.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createWebhook
      summary: Create a webhook
      description: Creates a webhook for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second webhook.
      tags:
      - Webhooks
      security:
      - bearerAuth:
        - webhooks:write
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The webhook to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookCreate'
      responses:
        '201':
          description: The webhook was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-WHK-001` when the webhook request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-WHK-003` when the customer is not allowed to use this webhook.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the webhook. The Problem `code` is `ERR-WHK-008` when the webhook is failing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-WHK-012` when the delivery is above the hourly limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/webhooks/{webhookId}:
    get:
      operationId: getWebhook
      summary: Get a webhook
      description: Returns one webhook by its identifier, with its current state and every field described in the Webhook schema.
      tags:
      - Webhooks
      security:
      - bearerAuth:
        - webhooks:read
        apiKey: []
      parameters:
      - name: webhookId
        in: path
        required: true
        description: Identifier of the webhook.
        schema:
          type: string
      responses:
        '200':
          description: The webhook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-WHK-004` when the application is not allowed to use this webhook.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The webhook was not found. The Problem `code` is `ERR-WHK-005` when no webhook exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateWebhook
      summary: Update a webhook
      description: Changes the writable fields of a webhook. Fields that are left out stay as they are.
      tags:
      - Webhooks
      security:
      - bearerAuth:
        - webhooks:write
        apiKey: []
      parameters:
      - name: webhookId
        in: path
        required: true
        description: Identifier of the webhook.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the change.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The fields to change on the webhook.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookUpdate'
      responses:
        '200':
          description: The webhook after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-WHK-001` when the webhook request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-WHK-003` when the customer is not allowed to use this webhook.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The webhook was not found. The Problem `code` is `ERR-WHK-005` when no webhook exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the webhook. The Problem `code` is `ERR-WHK-009` when the webhook is deleted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-WHK-013` when the delivery is above the daily limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/webhooks/{webhookId}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      summary: Rotate a webhook secret
      description: Creates a new signing secret and keeps the old one valid for a short overlap period.
      tags:
      - Webhooks
      security:
      - bearerAuth:
        - webhooks:write
        apiKey: []
      parameters:
      - name: webhookId
        in: path
        required: true
        description: Identifier of the webhook.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to rotate a webhook secret.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateWebhookSecretRequest'
      responses:
        '200':
          description: The action was applied and the webhook is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-WHK-002` when the webhook request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-WHK-003` when the customer is not allowed to use this webhook.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The webhook was not found. The Problem `code` is `ERR-WHK-006` when the webhook belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the webhook. The Problem `code` is `ERR-WHK-007` when the webhook is paused; or `ERR-WHK-010` when the webhook is disabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-WHK-011` when the delivery is above the per-minute limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Webhooks API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            webhooks:read: Read webhooks and their current state.
            webhooks:write: Create, change and close webhooks.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Webhook:
      type: object
      description: A webhook.
      required:
      - id
      - status
      - url
      properties:
        id:
          type: string
          description: Identifier of the webhook.
        status:
          type: string
          enum:
          - active
          - paused
          - failing
          - deleted
          description: Delivery state of the webhook.
        url:
          type: string
          format: uri
          description: Endpoint that receives the events.
        events:
          type: string
          description: Space-separated list of event types that are delivered.
        reference:
          type: string
          description: Name the partner gave the webhook.
        limit:
          type: integer
          minimum: 0
          description: Maximum deliveries per minute.
    WebhookList:
      type: object
      description: A page of webhooks.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'
          description: The webhooks on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    WebhookCreate:
      type: object
      description: Fields of a new webhook.
      required:
      - url
      - events
      properties:
        url:
          type: string
          format: uri
          description: Endpoint that receives the events.
        events:
          type: string
          description: Space-separated list of event types that are delivered.
        reference:
          type: string
          description: Name the partner gave the webhook.
        limit:
          type: integer
          minimum: 0
          description: Maximum deliveries per minute.
    WebhookUpdate:
      type: object
      description: Fields of a webhook that can be changed.
      properties:
        events:
          type: string
          description: Space-separated list of event types that are delivered.
        reference:
          type: string
          description: Name the partner gave the webhook.
        limit:
          type: integer
          minimum: 0
          description: Maximum deliveries per minute.
    RotateWebhookSecretRequest:
      type: object
      description: Details of the request to rotate a webhook secret.
      required:
      - overlapMinutes
      properties:
        overlapMinutes:
          type: integer
          minimum: 0
          description: Minutes during which the old secret still works.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-WHK-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
