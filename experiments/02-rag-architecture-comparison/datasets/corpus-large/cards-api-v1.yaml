openapi: 3.1.0
info:
  title: Lab Bank Cards API (v1)
  version: 1.0.0
  description: Issues payment cards and controls how they can be used. This is version 1 of the Cards API. The scopes are cards:read and cards:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Cards
  description: Operations on cards.
paths:
  /v1/cards:
    get:
      operationId: listCards
      summary: List cards
      description: Returns a page of cards, newest first. Use `pageSize` to choose how many come back, up to 50, and `pageToken` to fetch the next page.
      tags:
      - Cards
      security:
      - bearerAuth:
        - cards:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of cards to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return cards in this state.
        schema:
          type: string
          enum:
          - active
          - frozen
          - blocked
          - expired
      responses:
        '200':
          description: A page of cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-CRD-001` when the card request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-CRD-003` when the customer is not allowed to use this card.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/cards/{cardId}:
    get:
      operationId: getCard
      summary: Get a card
      description: Returns one card by its identifier, with its current state and every field described in the Card schema.
      tags:
      - Cards
      security:
      - bearerAuth:
        - cards:read
        apiKey: []
      parameters:
      - name: cardId
        in: path
        required: true
        description: Identifier of the card.
        schema:
          type: string
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-CRD-004` when the application is not allowed to use this card.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The card was not found. The Problem `code` is `ERR-CRD-005` when no card exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/cards/{cardId}/freeze:
    post:
      operationId: freezeCard
      summary: Freeze a card
      description: Temporarily stops the card from authorising payments until it is unfrozen.
      tags:
      - Cards
      security:
      - bearerAuth:
        - cards:write
        apiKey: []
      parameters:
      - name: cardId
        in: path
        required: true
        description: Identifier of the card.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to freeze a card.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreezeCardRequest'
      responses:
        '200':
          description: The action was applied and the card is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-CRD-002` when the card request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-CRD-003` when the customer is not allowed to use this card.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The card was not found. The Problem `code` is `ERR-CRD-006` when the card belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the card. The Problem `code` is `ERR-CRD-007` when the card is frozen; `ERR-CRD-008` when the card is blocked; `ERR-CRD-009` when the card is expired; `ERR-CRD-010` when the card is cancelled; or `ERR-CRD-011` when the card is replaced.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-CRD-012` when the spend is above the daily limit; `ERR-CRD-013` when the spend is above the monthly limit; or `ERR-CRD-014` when the spend is above the per-transaction limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Cards API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            cards:read: Read cards and their current state.
            cards:write: Create, change and close cards.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Card:
      type: object
      description: A card.
      required:
      - id
      - status
      - expiryDate
      properties:
        id:
          type: string
          description: Identifier of the card.
        status:
          type: string
          enum:
          - active
          - frozen
          - blocked
          - expired
          description: Lifecycle state of the card.
        expiryDate:
          type: string
          format: date
          description: Date on which the card stops working.
        limit:
          type: number
          minimum: 0
          maximum: 5000
          description: Spending limit per day, in the card currency.
        reference:
          type: string
          description: Card reference printed on the welcome letter.
        scheme:
          type: string
          enum:
          - debit
          - credit
          - prepaid
          description: Funding type of the card.
        lastFour:
          type: string
          description: Last four digits of the card number.
    CardList:
      type: object
      description: A page of cards.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          description: The cards on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    FreezeCardRequest:
      type: object
      description: Details of the request to freeze a card.
      required:
      - reason
      properties:
        reason:
          type: string
          enum:
          - lost
          - suspected_fraud
          - customer_request
          description: Why the card is frozen.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-CRD-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
