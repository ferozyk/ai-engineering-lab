openapi: 3.1.0
info:
  title: Lab Bank Limits API (v1)
  version: 1.0.0
  description: Sets the transaction limits that apply to a customer. This is version 1 of the Limits API. The scopes are limits:read and limits:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Limits
  description: Operations on limits.
paths:
  /v1/limits:
    get:
      operationId: listLimits
      summary: List limits
      description: Returns a page of limits, newest first. Use `pageSize` to choose how many come back, up to 100, and `pageToken` to fetch the next page.
      tags:
      - Limits
      security:
      - bearerAuth:
        - limits:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of limits to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return limits in this state.
        schema:
          type: string
          enum:
          - active
          - pending
          - revoked
          - expired
      responses:
        '200':
          description: A page of limits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-LIM-001` when the limit request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LIM-003` when the customer is not allowed to use this limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createLimit
      summary: Create a limit
      description: Creates a limit for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second limit.
      tags:
      - Limits
      security:
      - bearerAuth:
        - limits:write
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The limit to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LimitCreate'
      responses:
        '201':
          description: The limit was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Limit'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-LIM-001` when the limit request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LIM-003` when the customer is not allowed to use this limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the limit. The Problem `code` is `ERR-LIM-008` when the limit is revoked.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-LIM-012` when the increase is above the monthly limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/limits/{limitId}:
    get:
      operationId: getLimit
      summary: Get a limit
      description: Returns one limit by its identifier, with its current state and every field described in the Limit schema.
      tags:
      - Limits
      security:
      - bearerAuth:
        - limits:read
        apiKey: []
      parameters:
      - name: limitId
        in: path
        required: true
        description: Identifier of the limit.
        schema:
          type: string
      responses:
        '200':
          description: The limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Limit'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LIM-004` when the application is not allowed to use this limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The limit was not found. The Problem `code` is `ERR-LIM-005` when no limit exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: closeLimit
      summary: Close a limit
      description: Closes a limit. A closed limit cannot be reopened.
      tags:
      - Limits
      security:
      - bearerAuth:
        - limits:write
        apiKey: []
      parameters:
      - name: limitId
        in: path
        required: true
        description: Identifier of the limit.
        schema:
          type: string
      responses:
        '200':
          description: The limit was closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Limit'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LIM-003` when the customer is not allowed to use this limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The limit was not found. The Problem `code` is `ERR-LIM-005` when no limit exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the limit. The Problem `code` is `ERR-LIM-009` when the limit is expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/limits/{limitId}/raise:
    post:
      operationId: raiseLimit
      summary: Raise a limit
      description: Requests a higher limit, which takes effect once the approval check passes.
      tags:
      - Limits
      security:
      - bearerAuth:
        - limits:write
        apiKey: []
      parameters:
      - name: limitId
        in: path
        required: true
        description: Identifier of the limit.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to raise a limit.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaiseLimitRequest'
      responses:
        '200':
          description: The action was applied and the limit is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Limit'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-LIM-002` when the limit request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LIM-003` when the customer is not allowed to use this limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The limit was not found. The Problem `code` is `ERR-LIM-006` when the limit belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the limit. The Problem `code` is `ERR-LIM-007` when the limit is pending; or `ERR-LIM-010` when the limit is frozen.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-LIM-011` when the increase is above the daily limit; or `ERR-LIM-013` when the increase is above the lifetime limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Limits API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            limits:read: Read limits and their current state.
            limits:write: Create, change and close limits.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Limit:
      type: object
      description: A limit.
      required:
      - id
      - status
      - amount
      properties:
        id:
          type: string
          description: Identifier of the limit.
        status:
          type: string
          enum:
          - active
          - pending
          - revoked
          - expired
          description: State of the limit.
        amount:
          type: number
          minimum: 0
          maximum: 1000000
          description: Largest total allowed in the period.
        period:
          type: string
          enum:
          - daily
          - monthly
          - annual
          description: Period over which the total is counted.
        reference:
          type: string
          description: Reference of the approval that set the limit.
        expiresOn:
          type: string
          format: date
          description: Date on which a temporary limit reverts.
    LimitList:
      type: object
      description: A page of limits.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Limit'
          description: The limits on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    LimitCreate:
      type: object
      description: Fields of a new limit.
      required:
      - amount
      - period
      properties:
        amount:
          type: number
          minimum: 0
          maximum: 1000000
          description: Largest total allowed in the period.
        period:
          type: string
          enum:
          - daily
          - monthly
          - annual
          description: Period over which the total is counted.
        reference:
          type: string
          description: Reference of the approval that set the limit.
        expiresOn:
          type: string
          format: date
          description: Date on which a temporary limit reverts.
    RaiseLimitRequest:
      type: object
      description: Details of the request to raise a limit.
      required:
      - requestedAmount
      properties:
        requestedAmount:
          type: number
          minimum: 0
          maximum: 1000000
          description: New limit that is asked for.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-LIM-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
