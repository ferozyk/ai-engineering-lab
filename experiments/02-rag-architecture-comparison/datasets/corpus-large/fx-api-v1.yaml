openapi: 3.1.0
info:
  title: Lab Bank Foreign Exchange API (v1)
  version: 1.0.0
  description: Quotes and executes currency conversions. This is version 1 of the Foreign Exchange API. The scopes are fx:read and fx:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Foreign Exchange
  description: Operations on quotes.
paths:
  /v1/fx-quotes:
    get:
      operationId: listQuotes
      summary: List quotes
      description: Returns a page of quotes, newest first. Use `pageSize` to choose how many come back, up to 100, and `pageToken` to fetch the next page.
      tags:
      - Foreign Exchange
      security:
      - bearerAuth:
        - fx:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of quotes to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return quotes in this state.
        schema:
          type: string
          enum:
          - open
          - expired
          - executed
          - cancelled
      responses:
        '200':
          description: A page of quotes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-FXR-001` when the quote request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-FXR-003` when the customer is not allowed to use this quote.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/fx-quotes/{quoteId}:
    get:
      operationId: getQuote
      summary: Get a quote
      description: Returns one quote by its identifier, with its current state and every field described in the Quote schema.
      tags:
      - Foreign Exchange
      security:
      - bearerAuth:
        - fx:read
        apiKey: []
      parameters:
      - name: quoteId
        in: path
        required: true
        description: Identifier of the quote.
        schema:
          type: string
      responses:
        '200':
          description: The quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-FXR-004` when the application is not allowed to use this quote.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The quote was not found. The Problem `code` is `ERR-FXR-005` when no quote exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/fx-quotes/{quoteId}/convert:
    post:
      operationId: convertCurrency
      summary: Convert currency using a quote
      description: Executes the conversion at the quoted rate and books both legs on the customer's accounts.
      tags:
      - Foreign Exchange
      security:
      - bearerAuth:
        - fx:write
        apiKey: []
      parameters:
      - name: quoteId
        in: path
        required: true
        description: Identifier of the quote.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to convert currency using a quote.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertCurrencyRequest'
      responses:
        '200':
          description: The action was applied and the quote is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-FXR-002` when the quote request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-FXR-003` when the customer is not allowed to use this quote.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The quote was not found. The Problem `code` is `ERR-FXR-006` when the quote belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the quote. The Problem `code` is `ERR-FXR-007` when the quote is expired; `ERR-FXR-008` when the quote is executed; `ERR-FXR-009` when the quote is cancelled; or `ERR-FXR-010` when the quote is superseded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-FXR-011` when the conversion is above the daily limit; `ERR-FXR-012` when the conversion is above the monthly limit; or `ERR-FXR-013` when the conversion is above the single-deal limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Foreign Exchange API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            fx:read: Read quotes and their current state.
            fx:write: Create, change and close quotes.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Quote:
      type: object
      description: A quote.
      required:
      - id
      - status
      - sellCurrency
      properties:
        id:
          type: string
          description: Identifier of the quote.
        status:
          type: string
          enum:
          - open
          - expired
          - executed
          - cancelled
          description: Lifecycle state of the quote.
        sellCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: Currency that is sold.
        buyCurrency:
          type: string
          minLength: 3
          maxLength: 3
          description: Currency that is bought.
        amount:
          type: number
          minimum: 0
          maximum: 250000
          description: Amount of the sell currency.
        rate:
          type: number
          description: Exchange rate offered, as units of the buy currency per unit sold.
        reference:
          type: string
          description: Dealing reference of the quote.
        expiresOn:
          type: string
          format: date-time
          description: Instant at which the quoted rate stops being valid.
    QuoteList:
      type: object
      description: A page of quotes.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Quote'
          description: The quotes on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    ConvertCurrencyRequest:
      type: object
      description: Details of the request to convert currency using a quote.
      required:
      - accountReference
      properties:
        accountReference:
          type: string
          description: Account that receives the bought currency.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-FXR-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
