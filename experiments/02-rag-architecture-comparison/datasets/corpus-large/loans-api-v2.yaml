openapi: 3.1.0
info:
  title: Lab Bank Loans API (v2)
  version: 2.0.0
  description: Manages personal loans from application to settlement. This is version 2 of the Loans API. The scopes are loans:read, loans:write and loans:admin. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Loans
  description: Operations on loans.
paths:
  /v2/loans:
    get:
      operationId: listLoans
      summary: List loans
      description: Returns a page of loans, newest first. Use `pageSize` to choose how many come back, up to 50, and `pageToken` to fetch the next page.
      tags:
      - Loans
      security:
      - bearerAuth:
        - loans:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of loans to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return loans in this state.
        schema:
          type: string
          enum:
          - applied
          - approved
          - active
          - settled
      responses:
        '200':
          description: A page of loans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-LON-001` when the loan request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LON-003` when the customer is not allowed to use this loan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createLoan
      summary: Create a loan
      description: Creates a loan for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second loan.
      tags:
      - Loans
      security:
      - bearerAuth:
        - loans:write
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The loan to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanCreate'
      responses:
        '201':
          description: The loan was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-LON-001` when the loan request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LON-003` when the customer is not allowed to use this loan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the loan. The Problem `code` is `ERR-LON-008` when the loan is under review; or `ERR-LON-010` when the loan is written off.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-LON-012` when the repayment is above the monthly limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/loans/{loanId}:
    get:
      operationId: getLoan
      summary: Get a loan
      description: Returns one loan by its identifier, with its current state and every field described in the Loan schema.
      tags:
      - Loans
      security:
      - bearerAuth:
        - loans:read
        apiKey: []
      parameters:
      - name: loanId
        in: path
        required: true
        description: Identifier of the loan.
        schema:
          type: string
      responses:
        '200':
          description: The loan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LON-004` when the application is not allowed to use this loan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The loan was not found. The Problem `code` is `ERR-LON-005` when no loan exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/loans/{loanId}/repay:
    post:
      operationId: repayLoan
      summary: Repay a loan
      description: Takes a repayment from the linked current account and applies it to the loan balance.
      tags:
      - Loans
      security:
      - bearerAuth:
        - loans:admin
        apiKey: []
      parameters:
      - name: loanId
        in: path
        required: true
        description: Identifier of the loan.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to repay a loan.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepayLoanRequest'
      responses:
        '200':
          description: The action was applied and the loan is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-LON-002` when the loan request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LON-003` when the customer is not allowed to use this loan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The loan was not found. The Problem `code` is `ERR-LON-006` when the loan belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the loan. The Problem `code` is `ERR-LON-007` when the loan is applied; or `ERR-LON-009` when the loan is settled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-LON-011` when the repayment is above the early limit; or `ERR-LON-013` when the repayment is above the single limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/loans/search:
    post:
      operationId: searchLoans
      summary: Search loans
      description: Finds loans that match every filter in the request body. Use it instead of listing when you need to filter by more than one field.
      tags:
      - Loans
      security:
      - bearerAuth:
        - loans:read
        apiKey: []
      requestBody:
        required: true
        description: Filters that every returned loan must match.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanSearch'
      responses:
        '200':
          description: A page of loans that match the search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-LON-001` when the loan request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-LON-003` when the customer is not allowed to use this loan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Loans API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            loans:read: Read loans and their current state.
            loans:write: Create, change and close loans.
            loans:admin: Run privileged actions such as repay a loan.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Loan:
      type: object
      description: A loan.
      required:
      - id
      - status
      - principal
      properties:
        id:
          type: string
          description: Identifier of the loan.
        status:
          type: string
          enum:
          - applied
          - approved
          - active
          - settled
          description: Lifecycle state of the loan.
        principal:
          type: number
          minimum: 0
          maximum: 500000
          description: Amount originally borrowed.
        interestRate:
          type: number
          description: Annual interest rate as a percentage.
        termMonths:
          type: integer
          minimum: 0
          description: Length of the loan in months.
        reference:
          type: string
          description: Loan agreement reference.
    LoanList:
      type: object
      description: A page of loans.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Loan'
          description: The loans on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    LoanCreate:
      type: object
      description: Fields of a new loan.
      required:
      - principal
      - interestRate
      properties:
        principal:
          type: number
          minimum: 0
          maximum: 500000
          description: Amount originally borrowed.
        interestRate:
          type: number
          description: Annual interest rate as a percentage.
        termMonths:
          type: integer
          minimum: 0
          description: Length of the loan in months.
        reference:
          type: string
          description: Loan agreement reference.
    RepayLoanRequest:
      type: object
      description: Details of the request to repay a loan.
      required:
      - amount
      properties:
        amount:
          type: number
          minimum: 0
          maximum: 500000
          description: Repayment amount.
    LoanSearch:
      type: object
      description: Filters of a loan search. Every filter that is given must match.
      properties:
        status:
          type: string
          enum:
          - applied
          - approved
          - active
          - settled
          description: Lifecycle state of the loan.
        principal:
          type: number
          minimum: 0
          maximum: 500000
          description: Amount originally borrowed.
        createdAfter:
          type: string
          format: date-time
          description: Only loans created after this instant.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-LON-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
