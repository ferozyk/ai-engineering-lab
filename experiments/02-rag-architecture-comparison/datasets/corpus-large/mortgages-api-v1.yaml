openapi: 3.1.0
info:
  title: Lab Bank Mortgages API (v1)
  version: 1.0.0
  description: Manages home loans from offer to redemption. This is version 1 of the Mortgages API. The scopes are mortgages:read and mortgages:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Mortgages
  description: Operations on mortgages.
paths:
  /v1/mortgages:
    get:
      operationId: listMortgages
      summary: List mortgages
      description: Returns a page of mortgages, newest first. Use `pageSize` to choose how many come back, up to 50, and `pageToken` to fetch the next page.
      tags:
      - Mortgages
      security:
      - bearerAuth:
        - mortgages:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of mortgages to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return mortgages in this state.
        schema:
          type: string
          enum:
          - applied
          - offered
          - active
          - redeemed
      responses:
        '200':
          description: A page of mortgages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MortgageList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-MTG-001` when the mortgage request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MTG-003` when the customer is not allowed to use this mortgage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createMortgage
      summary: Create a mortgage
      description: Creates a mortgage for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second mortgage.
      tags:
      - Mortgages
      security:
      - bearerAuth:
        - mortgages:write
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The mortgage to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MortgageCreate'
      responses:
        '201':
          description: The mortgage was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mortgage'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-MTG-001` when the mortgage request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MTG-003` when the customer is not allowed to use this mortgage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the mortgage. The Problem `code` is `ERR-MTG-008` when the mortgage is redeemed; or `ERR-MTG-011` when the mortgage is transferred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-MTG-013` when the overpayment is above the monthly limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/mortgages/{mortgageId}:
    get:
      operationId: getMortgage
      summary: Get a mortgage
      description: Returns one mortgage by its identifier, with its current state and every field described in the Mortgage schema.
      tags:
      - Mortgages
      security:
      - bearerAuth:
        - mortgages:read
        apiKey: []
      parameters:
      - name: mortgageId
        in: path
        required: true
        description: Identifier of the mortgage.
        schema:
          type: string
      responses:
        '200':
          description: The mortgage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mortgage'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MTG-004` when the application is not allowed to use this mortgage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The mortgage was not found. The Problem `code` is `ERR-MTG-005` when no mortgage exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    delete:
      operationId: closeMortgage
      summary: Close a mortgage
      description: Closes a mortgage. A closed mortgage cannot be reopened.
      tags:
      - Mortgages
      security:
      - bearerAuth:
        - mortgages:write
        apiKey: []
      parameters:
      - name: mortgageId
        in: path
        required: true
        description: Identifier of the mortgage.
        schema:
          type: string
      responses:
        '200':
          description: The mortgage was closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mortgage'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MTG-003` when the customer is not allowed to use this mortgage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The mortgage was not found. The Problem `code` is `ERR-MTG-005` when no mortgage exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the mortgage. The Problem `code` is `ERR-MTG-009` when the mortgage is in arrears.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/mortgages/{mortgageId}/overpay:
    post:
      operationId: makeOverpayment
      summary: Make an overpayment
      description: Pays extra towards the principal, which shortens the term or lowers the instalments.
      tags:
      - Mortgages
      security:
      - bearerAuth:
        - mortgages:write
        apiKey: []
      parameters:
      - name: mortgageId
        in: path
        required: true
        description: Identifier of the mortgage.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to make an overpayment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakeOverpaymentRequest'
      responses:
        '200':
          description: The action was applied and the mortgage is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mortgage'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-MTG-002` when the mortgage request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MTG-003` when the customer is not allowed to use this mortgage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The mortgage was not found. The Problem `code` is `ERR-MTG-006` when the mortgage belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the mortgage. The Problem `code` is `ERR-MTG-007` when the mortgage is offered; or `ERR-MTG-010` when the mortgage is frozen.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-MTG-012` when the overpayment is above the annual limit; or `ERR-MTG-014` when the overpayment is above the single limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Mortgages API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            mortgages:read: Read mortgages and their current state.
            mortgages:write: Create, change and close mortgages.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Mortgage:
      type: object
      description: A mortgage.
      required:
      - id
      - status
      - principal
      properties:
        id:
          type: string
          description: Identifier of the mortgage.
        status:
          type: string
          enum:
          - applied
          - offered
          - active
          - redeemed
          description: Lifecycle state of the mortgage.
        principal:
          type: number
          minimum: 0
          maximum: 5000000
          description: Amount borrowed.
        termYears:
          type: integer
          minimum: 0
          description: Length of the mortgage in years.
        rateType:
          type: string
          enum:
          - fixed
          - variable
          - tracker
          description: How the interest rate is set.
        reference:
          type: string
          description: Mortgage account reference.
        expiresOn:
          type: string
          format: date
          description: Date on which the mortgage offer lapses.
    MortgageList:
      type: object
      description: A page of mortgages.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Mortgage'
          description: The mortgages on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    MortgageCreate:
      type: object
      description: Fields of a new mortgage.
      required:
      - principal
      - termYears
      properties:
        principal:
          type: number
          minimum: 0
          maximum: 5000000
          description: Amount borrowed.
        termYears:
          type: integer
          minimum: 0
          description: Length of the mortgage in years.
        rateType:
          type: string
          enum:
          - fixed
          - variable
          - tracker
          description: How the interest rate is set.
        reference:
          type: string
          description: Mortgage account reference.
    MakeOverpaymentRequest:
      type: object
      description: Details of the request to make an overpayment.
      required:
      - amount
      properties:
        amount:
          type: number
          minimum: 0
          maximum: 5000000
          description: Amount of the overpayment.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-MTG-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
