openapi: 3.1.0
info:
  title: Lab Bank Identity Verification API (v2)
  version: 2.0.0
  description: Runs identity checks on customers. This is version 2 of the Identity Verification API. The scopes are kyc:read, kyc:manage and kyc:admin. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Identity Verification
  description: Operations on verifications.
paths:
  /v2/kyc-verifications:
    get:
      operationId: listVerifications
      summary: List verifications
      description: Returns a page of verifications, newest first. Use `pageSize` to choose how many come back, up to 50, and `pageToken` to fetch the next page.
      tags:
      - Identity Verification
      security:
      - bearerAuth:
        - kyc:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of verifications to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return verifications in this state.
        schema:
          type: string
          enum:
          - pending
          - passed
          - failed
          - expired
      responses:
        '200':
          description: A page of verifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-KYC-001` when the verification request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-KYC-003` when the customer is not allowed to use this verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createVerification
      summary: Create a verification
      description: Creates a verification for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second verification.
      tags:
      - Identity Verification
      security:
      - bearerAuth:
        - kyc:manage
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The verification to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationCreate'
      responses:
        '201':
          description: The verification was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-KYC-001` when the verification request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-KYC-003` when the customer is not allowed to use this verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the verification. The Problem `code` is `ERR-KYC-008` when the verification is failed; or `ERR-KYC-010` when the verification is suspended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-KYC-013` when the attempt is above the lifetime limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/kyc-verifications/{verificationId}:
    get:
      operationId: getVerification
      summary: Get a verification
      description: Returns one verification by its identifier, with its current state and every field described in the Verification schema.
      tags:
      - Identity Verification
      security:
      - bearerAuth:
        - kyc:read
        apiKey: []
      parameters:
      - name: verificationId
        in: path
        required: true
        description: Identifier of the verification.
        schema:
          type: string
      responses:
        '200':
          description: The verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-KYC-004` when the application is not allowed to use this verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The verification was not found. The Problem `code` is `ERR-KYC-005` when no verification exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/kyc-verifications/{verificationId}/retry:
    post:
      operationId: retryVerification
      summary: Retry a verification
      description: Starts a new check for a verification that failed or expired.
      tags:
      - Identity Verification
      security:
      - bearerAuth:
        - kyc:admin
        apiKey: []
      parameters:
      - name: verificationId
        in: path
        required: true
        description: Identifier of the verification.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to retry a verification.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryVerificationRequest'
      responses:
        '200':
          description: The action was applied and the verification is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-KYC-002` when the verification request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-KYC-003` when the customer is not allowed to use this verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The verification was not found. The Problem `code` is `ERR-KYC-006` when the verification belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the verification. The Problem `code` is `ERR-KYC-007` when the verification is pending; `ERR-KYC-009` when the verification is expired; or `ERR-KYC-011` when the verification is withdrawn.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-KYC-012` when the attempt is above the daily limit; or `ERR-KYC-014` when the attempt is above the per-document limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/kyc-verifications/search:
    post:
      operationId: searchVerifications
      summary: Search verifications
      description: Finds verifications that match every filter in the request body. Use it instead of listing when you need to filter by more than one field.
      tags:
      - Identity Verification
      security:
      - bearerAuth:
        - kyc:read
        apiKey: []
      requestBody:
        required: true
        description: Filters that every returned verification must match.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationSearch'
      responses:
        '200':
          description: A page of verifications that match the search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-KYC-001` when the verification request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-KYC-003` when the customer is not allowed to use this verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Identity Verification API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            kyc:read: Read verifications and their current state.
            kyc:manage: Create, change and close verifications.
            kyc:admin: Run privileged actions such as retry a verification.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Verification:
      type: object
      description: A verification.
      required:
      - id
      - status
      - level
      properties:
        id:
          type: string
          description: Identifier of the verification.
        status:
          type: string
          enum:
          - pending
          - passed
          - failed
          - expired
          description: Outcome of the identity check.
        level:
          type: string
          enum:
          - basic
          - standard
          - enhanced
          description: Depth of the check that was run.
        reference:
          type: string
          description: Reference of the check at the screening provider.
        expiresOn:
          type: string
          format: date
          description: Date on which a passed check must be repeated.
        limit:
          type: integer
          minimum: 0
          description: Number of attempts the customer has left.
    VerificationList:
      type: object
      description: A page of verifications.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Verification'
          description: The verifications on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    VerificationCreate:
      type: object
      description: Fields of a new verification.
      required:
      - level
      - reference
      properties:
        level:
          type: string
          enum:
          - basic
          - standard
          - enhanced
          description: Depth of the check that was run.
        reference:
          type: string
          description: Reference of the check at the screening provider.
        expiresOn:
          type: string
          format: date
          description: Date on which a passed check must be repeated.
        limit:
          type: integer
          minimum: 0
          description: Number of attempts the customer has left.
    RetryVerificationRequest:
      type: object
      description: Details of the request to retry a verification.
      required:
      - level
      properties:
        level:
          type: string
          enum:
          - basic
          - standard
          - enhanced
          description: Depth of the new check.
    VerificationSearch:
      type: object
      description: Filters of a verification search. Every filter that is given must match.
      properties:
        status:
          type: string
          enum:
          - pending
          - passed
          - failed
          - expired
          description: Outcome of the identity check.
        level:
          type: string
          enum:
          - basic
          - standard
          - enhanced
          description: Depth of the check that was run.
        createdAfter:
          type: string
          format: date-time
          description: Only verifications created after this instant.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-KYC-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
