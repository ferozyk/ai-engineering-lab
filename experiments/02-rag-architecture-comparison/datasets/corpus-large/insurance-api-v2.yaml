openapi: 3.1.0
info:
  title: Lab Bank Insurance API (v2)
  version: 2.0.0
  description: Sells and manages insurance policies. This is version 2 of the Insurance API. The scopes are insurance:read, insurance:write and insurance:admin. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Insurance
  description: Operations on policies.
paths:
  /v2/insurance-policies:
    get:
      operationId: listPolicies
      summary: List policies
      description: Returns a page of policies, newest first. Use `pageSize` to choose how many come back, up to 25, and `pageToken` to fetch the next page.
      tags:
      - Insurance
      security:
      - bearerAuth:
        - insurance:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of policies to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 25
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return policies in this state.
        schema:
          type: string
          enum:
          - quoted
          - active
          - lapsed
          - cancelled
      responses:
        '200':
          description: A page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-INS-001` when the policy request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-INS-003` when the customer is not allowed to use this policy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/insurance-policies/{policyId}:
    get:
      operationId: getPolicy
      summary: Get a policy
      description: Returns one policy by its identifier, with its current state and every field described in the Policy schema.
      tags:
      - Insurance
      security:
      - bearerAuth:
        - insurance:read
        apiKey: []
      parameters:
      - name: policyId
        in: path
        required: true
        description: Identifier of the policy.
        schema:
          type: string
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-INS-004` when the application is not allowed to use this policy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The policy was not found. The Problem `code` is `ERR-INS-005` when no policy exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/insurance-policies/{policyId}/renew:
    post:
      operationId: renewPolicy
      summary: Renew a policy
      description: Extends the cover for another term at the current premium.
      tags:
      - Insurance
      security:
      - bearerAuth:
        - insurance:admin
        apiKey: []
      parameters:
      - name: policyId
        in: path
        required: true
        description: Identifier of the policy.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to renew a policy.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewPolicyRequest'
      responses:
        '200':
          description: The action was applied and the policy is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-INS-002` when the policy request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-INS-003` when the customer is not allowed to use this policy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The policy was not found. The Problem `code` is `ERR-INS-006` when the policy belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the policy. The Problem `code` is `ERR-INS-007` when the policy is quoted; `ERR-INS-008` when the policy is lapsed; `ERR-INS-009` when the policy is cancelled; or `ERR-INS-010` when the policy is suspended.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-INS-011` when the claim is above the per-claim limit; `ERR-INS-012` when the claim is above the annual limit; or `ERR-INS-013` when the claim is above the lifetime limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Insurance API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            insurance:read: Read policies and their current state.
            insurance:write: Create, change and close policies.
            insurance:admin: Run privileged actions such as renew a policy.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Policy:
      type: object
      description: A policy.
      required:
      - id
      - status
      - coverAmount
      properties:
        id:
          type: string
          description: Identifier of the policy.
        status:
          type: string
          enum:
          - quoted
          - active
          - lapsed
          - cancelled
          description: Lifecycle state of the policy.
        coverAmount:
          type: number
          minimum: 0
          maximum: 2000000
          description: Largest amount the policy pays out.
        premiumAmount:
          type: number
          minimum: 0
          maximum: 100000
          description: Amount charged each month.
        reference:
          type: string
          description: Policy number.
        expiresOn:
          type: string
          format: date
          description: Date on which the cover ends.
    PolicyList:
      type: object
      description: A page of policies.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Policy'
          description: The policies on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    RenewPolicyRequest:
      type: object
      description: Details of the request to renew a policy.
      required:
      - termMonths
      properties:
        termMonths:
          type: integer
          minimum: 0
          description: Length of the new term in months.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-INS-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
