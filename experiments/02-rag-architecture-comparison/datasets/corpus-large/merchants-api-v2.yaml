openapi: 3.1.0
info:
  title: Lab Bank Merchants API (v2)
  version: 2.0.0
  description: Onboards and manages businesses that accept card payments. This is version 2 of the Merchants API. The scopes are merchants:read and merchants:write. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution.
servers:
- url: https://api.labbank.example
tags:
- name: Merchants
  description: Operations on merchants.
paths:
  /v2/merchants:
    get:
      operationId: listMerchants
      summary: List merchants
      description: Returns a page of merchants, newest first. Use `pageSize` to choose how many come back, up to 100, and `pageToken` to fetch the next page.
      tags:
      - Merchants
      security:
      - bearerAuth:
        - merchants:read
        apiKey: []
      parameters:
      - name: pageSize
        in: query
        required: false
        description: Number of merchants to return on one page. The default is 20.
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: pageToken
        in: query
        required: false
        description: Token from the previous page. Leave it out to start at the beginning.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only return merchants in this state.
        schema:
          type: string
          enum:
          - onboarding
          - active
          - restricted
          - closed
      responses:
        '200':
          description: A page of merchants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantList'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-MER-001` when the merchant request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MER-003` when the customer is not allowed to use this merchant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createMerchant
      summary: Create a merchant
      description: Creates a merchant for the authenticated customer. Send an `Idempotency-Key` header so that a retried request does not create a second merchant.
      tags:
      - Merchants
      security:
      - bearerAuth:
        - merchants:write
        apiKey: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the creation.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: The merchant to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantCreate'
      responses:
        '201':
          description: The merchant was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-MER-001` when the merchant request is missing a required field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MER-003` when the customer is not allowed to use this merchant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the merchant. The Problem `code` is `ERR-MER-008` when the merchant is restricted; or `ERR-MER-010` when the merchant is terminated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-MER-012` when the processing volume is above the monthly limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/merchants/{merchantId}:
    get:
      operationId: getMerchant
      summary: Get a merchant
      description: Returns one merchant by its identifier, with its current state and every field described in the Merchant schema.
      tags:
      - Merchants
      security:
      - bearerAuth:
        - merchants:read
        apiKey: []
      parameters:
      - name: merchantId
        in: path
        required: true
        description: Identifier of the merchant.
        schema:
          type: string
      responses:
        '200':
          description: The merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MER-004` when the application is not allowed to use this merchant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The merchant was not found. The Problem `code` is `ERR-MER-005` when no merchant exists with that identifier.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v2/merchants/{merchantId}/restrict:
    post:
      operationId: restrictMerchant
      summary: Restrict a merchant
      description: Limits what the merchant can process while a compliance review is open.
      tags:
      - Merchants
      security:
      - bearerAuth:
        - merchants:write
        apiKey: []
      parameters:
      - name: merchantId
        in: path
        required: true
        description: Identifier of the merchant.
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique key of up to 64 characters. A retried request with the same key returns the original result instead of repeating the action.
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        description: Details of the request to restrict a merchant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestrictMerchantRequest'
      responses:
        '200':
          description: The action was applied and the merchant is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          description: The request is malformed or fails validation. The Problem `code` is `ERR-MER-002` when the merchant request has a field of the wrong type.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: The caller is not allowed to perform this action. The Problem `code` is `ERR-MER-003` when the customer is not allowed to use this merchant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: The merchant was not found. The Problem `code` is `ERR-MER-006` when the merchant belongs to a different customer.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The request conflicts with the current state of the merchant. The Problem `code` is `ERR-MER-007` when the merchant is onboarding; or `ERR-MER-009` when the merchant is closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The request is well formed but breaks a business rule. The Problem `code` is `ERR-MER-011` when the processing volume is above the daily limit; or `ERR-MER-013` when the processing volume is above the per-sale limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again.
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: 'Access token for the Merchants API, obtained from the token endpoint of the Authentication API with the client credentials grant and sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs.'
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            merchants:read: Read merchants and their current state.
            merchants:write: Create, change and close merchants.
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Application key issued to the client when it was registered. It identifies the calling application and is sent with every request in addition to the bearer token.
  schemas:
    Merchant:
      type: object
      description: A merchant.
      required:
      - id
      - status
      - legalName
      properties:
        id:
          type: string
          description: Identifier of the merchant.
        status:
          type: string
          enum:
          - onboarding
          - active
          - restricted
          - closed
          description: Onboarding and trading state of the merchant.
        legalName:
          type: string
          description: Registered name of the business.
        category:
          type: string
          description: Merchant category code.
        reference:
          type: string
          description: Acquiring contract reference.
        limit:
          type: number
          minimum: 0
          maximum: 2000000
          description: Monthly processing limit.
    MerchantList:
      type: object
      description: A page of merchants.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Merchant'
          description: The merchants on this page.
        nextPageToken:
          type: string
          description: Token that fetches the next page. Absent on the last page.
    MerchantCreate:
      type: object
      description: Fields of a new merchant.
      required:
      - legalName
      - category
      properties:
        legalName:
          type: string
          description: Registered name of the business.
        category:
          type: string
          description: Merchant category code.
        reference:
          type: string
          description: Acquiring contract reference.
        limit:
          type: number
          minimum: 0
          maximum: 2000000
          description: Monthly processing limit.
    RestrictMerchantRequest:
      type: object
      description: Details of the request to restrict a merchant.
      required:
      - reason
      properties:
        reason:
          type: string
          description: Why the merchant is restricted.
    Problem:
      type: object
      description: Error body returned for every failed call, with the application/problem+json media type.
      required:
      - type
      - title
      - status
      - code
      - detail
      properties:
        type:
          type: string
          format: uri
          description: URI that identifies the kind of problem.
        title:
          type: string
          description: Short, human-readable summary of the problem.
        status:
          type: integer
          description: HTTP status code of the response.
        code:
          type: string
          description: Lab Bank error code, for example ERR-MER-001.
        detail:
          type: string
          description: Explanation specific to this occurrence of the problem.
        correlationId:
          type: string
          description: Correlation identifier of the failed call.
