openapi: 3.1.0
info:
  title: Lab Bank Statements API
  version: 1.0.0
  description: "Lists and downloads monthly account statements and requests statements for custom date ranges. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution."
servers:
  - url: https://api.labbank.example
tags:
  - name: Statements
    description: "Account statements."
paths:
  /v1/accounts/{accountId}/statements:
    get:
      operationId: listStatements
      summary: List statements
      description: "Returns the statements of an account for one calendar year. Statements are produced monthly, so a full year holds up to twelve entries."
      tags: [Statements]
      security:
        - bearerAuth: ["statements:read"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CorrelationId"
        - name: year
          in: query
          required: true
          description: "Calendar year to list."
          schema:
            type: integer
      responses:
        "200":
          description: "The statements of the account for the year."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatementSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/accounts/{accountId}/statements/{statementId}:
    get:
      operationId: getStatement
      summary: Get a statement
      description: "Returns one statement either as a PDF document or as JSON. Choose the representation with the Accept header."
      tags: [Statements]
      security:
        - bearerAuth: ["statements:read"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: statementId
          in: path
          required: true
          description: "Identifier of the statement."
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The statement in the representation selected with the Accept header."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/accounts/{accountId}/statement-requests:
    post:
      operationId: requestStatement
      summary: Request a statement
      description: "Asks the bank to prepare a statement for any date range instead of a calendar month. The statement is prepared asynchronously, so the call returns at once with a request that can be polled."
      tags: [Statements]
      security:
        - bearerAuth: ["statements:read"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        description: "The date range and the format of the statement."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatementRequest"
      responses:
        "202":
          description: "The request was accepted and is being processed."
          headers:
            Location:
              description: "URL of the new request, /v1/statement-requests/{requestId}."
              schema:
                type: string
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementRequestStatus"
        "400":
          description: "The date range is not valid: toDate is before fromDate, or the range is longer than 366 days. The Problem `code` is `VAL-001`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/statement-requests/{requestId}:
    get:
      operationId: getStatementRequestStatus
      summary: Get the status of a statement request
      description: "Returns the progress of a statement request. When the status is READY the response carries the statementId to download."
      tags: [Statements]
      security:
        - bearerAuth: ["statements:read"]
          apiKey: []
      parameters:
        - name: requestId
          in: path
          required: true
          description: "Identifier of the statement request."
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The current status of the request."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatementRequestStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: "OAuth 2.0 access token obtained from the token endpoint with the client credentials grant. The token is sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs."
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            "customers:read": "Read customer profiles, linked accounts and consents."
            "customers:write": "Change customer contact details."
            "accounts:read": "Read accounts, balances and transactions."
            "statements:read": "Read and request account statements."
            "payments:write": "Initiate, read and cancel payments."
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: "Key identifying the consuming application. It is required on every call in addition to the bearer token."
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: "Optional identifier chosen by the caller to trace a call across systems. It is echoed in the X-Correlation-Id response header and in the Problem correlationId field."
      schema:
        type: string
        maxLength: 64
    AccountId:
      name: accountId
      in: path
      required: true
      description: "Identifier of the account."
      schema:
        type: string
  headers:
    CorrelationId:
      description: "The correlation identifier of the call. It repeats the caller's value, or a generated one when none was sent."
      schema:
        type: string
  responses:
    BadRequest:
      description: "The request is malformed or fails validation. The Problem `code` is `VAL-001`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "The access token is valid but does not carry the scope the operation requires. The Problem `code` is `AUTH-002`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "The account, statement or statement request does not exist. The Problem `code` is `STM-404`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: "Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again."
      headers:
        Retry-After:
          description: "Number of seconds to wait before retrying."
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Amount:
      type: object
      description: "A monetary amount in a single currency."
      required: [value, currency]
      properties:
        value:
          type: string
          description: "Decimal amount as a string, for example 125.40, to avoid rounding errors."
        currency:
          type: string
          description: "ISO 4217 currency code, for example EUR."
    StatementSummary:
      type: object
      description: "A statement in a listing."
      required: [statementId, periodStart, periodEnd, format]
      properties:
        statementId:
          type: string
          description: "Identifier of the statement."
        periodStart:
          type: string
          format: date
          description: "First day covered."
        periodEnd:
          type: string
          format: date
          description: "Last day covered."
        format:
          type: string
          enum: [PDF, CSV]
          description: "Format the statement was produced in."
    StatementLine:
      type: object
      description: "One booked line on a statement."
      required: [bookingDate, amount]
      properties:
        bookingDate:
          type: string
          format: date
          description: "Date the line was booked."
        description:
          type: string
          description: "Description of the line."
        amount:
          $ref: "#/components/schemas/Amount"
    Statement:
      type: object
      description: "The content of a statement in JSON form."
      required: [statementId, accountId, periodStart, periodEnd, openingBalance, closingBalance, lines]
      properties:
        statementId:
          type: string
          description: "Identifier of the statement."
        accountId:
          type: string
          description: "Account the statement belongs to."
        periodStart:
          type: string
          format: date
          description: "First day covered."
        periodEnd:
          type: string
          format: date
          description: "Last day covered."
        openingBalance:
          $ref: "#/components/schemas/Amount"
        closingBalance:
          $ref: "#/components/schemas/Amount"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StatementLine"
          description: "The booked lines in the period."
    StatementRequest:
      type: object
      description: "A request for a statement covering a custom date range."
      required: [fromDate, toDate, format]
      properties:
        fromDate:
          type: string
          format: date
          description: "First day to cover."
        toDate:
          type: string
          format: date
          description: "Last day to cover. It must not be before fromDate, and the range must not exceed 366 days."
        format:
          type: string
          enum: [PDF, CSV]
          description: "Format to produce."
        language:
          type: string
          enum: [en, fr]
          description: "Language of the labels on the statement."
    StatementRequestStatus:
      type: object
      description: "Progress of a statement request."
      required: [requestId, status]
      properties:
        requestId:
          type: string
          description: "Identifier of the request."
        status:
          type: string
          enum: [PENDING, READY, FAILED]
          description: "Current state of the request."
        statementId:
          type: string
          description: "Identifier of the finished statement. Present only when the status is READY."
    Problem:
      type: object
      description: "Error body returned for every failed call, with the application/problem+json media type."
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri
          description: "URI that identifies the kind of problem."
        title:
          type: string
          description: "Short, human-readable summary of the problem."
        status:
          type: integer
          description: "HTTP status code of the response."
        code:
          type: string
          description: "Lab Bank error code, for example AUTH-001."
        detail:
          type: string
          description: "Explanation specific to this occurrence of the problem."
        correlationId:
          type: string
          description: "Correlation identifier of the failed call."
