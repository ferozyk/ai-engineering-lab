openapi: 3.1.0
info:
  title: Lab Bank Customers API
  version: 1.0.0
  description: "Reads customer profiles, lists the accounts and consents of a customer and updates contact details. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution."
servers:
  - url: https://api.labbank.example
tags:
  - name: Customers
    description: "Customer profiles and their accounts."
  - name: Consents
    description: "Consents granted by a customer."
paths:
  /v1/customers:
    get:
      operationId: searchCustomers
      summary: Search customers
      description: "Finds customers by email address or last name. Results are returned one page at a time."
      tags: [Customers]
      security:
        - bearerAuth: ["customers:read"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: email
          in: query
          required: false
          description: "Exact email address to look for."
          schema:
            type: string
            format: email
        - name: lastName
          in: query
          required: false
          description: "Last name to look for."
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: "Page number, starting at 1."
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          description: "Number of customers on a page."
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "A page of matching customers."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/customers/{customerId}:
    get:
      operationId: getCustomer
      summary: Get a customer
      description: "Returns the profile of one customer."
      tags: [Customers]
      security:
        - bearerAuth: ["customers:read"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The customer profile."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/customers/{customerId}/accounts:
    get:
      operationId: listCustomerAccounts
      summary: List the accounts of a customer
      description: "Returns every account held by the customer, including blocked accounts. Use the accountId values with the Accounts and Statements APIs."
      tags: [Customers]
      security:
        - bearerAuth: ["customers:read"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The accounts held by the customer."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/customers/{customerId}/contact-details:
    patch:
      operationId: updateContactDetails
      summary: Update contact details
      description: "Replaces the email address, phone number and postal address of a customer. Only the fields that are sent are changed, and email is always required."
      tags: [Customers]
      security:
        - bearerAuth: ["customers:write"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        description: "The new contact details."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactDetailsUpdate"
      responses:
        "200":
          description: "The customer with the updated contact details."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/customers/{customerId}/consents:
    get:
      operationId: listConsents
      summary: List consents
      description: "Returns the consents a customer has granted, together with their purpose and expiry."
      tags: [Consents]
      security:
        - bearerAuth: ["customers:read"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/CustomerId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The consents of the customer."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: "OAuth 2.0 access token obtained from the token endpoint with the client credentials grant. The token is sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs."
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            "customers:read": "Read customer profiles, linked accounts and consents."
            "customers:write": "Change customer contact details."
            "accounts:read": "Read accounts, balances and transactions."
            "statements:read": "Read and request account statements."
            "payments:write": "Initiate, read and cancel payments."
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: "Key identifying the consuming application. It is required on every call in addition to the bearer token."
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: "Optional identifier chosen by the caller to trace a call across systems. It is echoed in the X-Correlation-Id response header and in the Problem correlationId field."
      schema:
        type: string
        maxLength: 64
    CustomerId:
      name: customerId
      in: path
      required: true
      description: "Identifier of the customer."
      schema:
        type: string
  headers:
    CorrelationId:
      description: "The correlation identifier of the call. It repeats the caller's value, or a generated one when none was sent."
      schema:
        type: string
  responses:
    BadRequest:
      description: "The request is malformed or fails validation. The Problem `code` is `VAL-001`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "The access token is valid but does not carry the scope the operation requires. The Problem `code` is `AUTH-002`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "The customer does not exist. The Problem `code` is `CUS-404`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: "Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again."
      headers:
        Retry-After:
          description: "Number of seconds to wait before retrying."
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Address:
      type: object
      description: "A postal address."
      required: [street, city, postalCode, country]
      properties:
        street:
          type: string
          description: "Street name and number."
        city:
          type: string
          description: "City or town."
        postalCode:
          type: string
          description: "Postal code."
        country:
          type: string
          description: "ISO 3166-1 alpha-2 country code."
    Customer:
      type: object
      description: "The profile of a bank customer."
      required: [customerId, firstName, lastName, segment]
      properties:
        customerId:
          type: string
          description: "Identifier of the customer."
        firstName:
          type: string
          description: "Given name."
        lastName:
          type: string
          description: "Family name."
        dateOfBirth:
          type: string
          format: date
          description: "Date of birth."
        email:
          type: string
          format: email
          description: "Primary email address."
        phone:
          type: string
          description: "Primary phone number in international format."
        address:
          $ref: "#/components/schemas/Address"
        segment:
          type: string
          enum: [RETAIL, PRIVATE]
          description: "Customer segment."
    CustomerPage:
      type: object
      description: "One page of customers."
      required: [items, page, pageSize, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
          description: "The customers on this page."
        page:
          type: integer
          description: "Page number, starting at 1."
        pageSize:
          type: integer
          description: "Number of customers requested per page."
        totalItems:
          type: integer
          description: "Total number of customers that match the search."
    AccountSummary:
      type: object
      description: "A short description of an account, as listed under a customer."
      required: [accountId, iban, currency, productName, status]
      properties:
        accountId:
          type: string
          description: "Identifier of the account."
        iban:
          type: string
          description: "International bank account number."
        currency:
          type: string
          description: "ISO 4217 currency code of the account."
        productName:
          type: string
          description: "Name of the account product."
        status:
          type: string
          enum: [OPEN, BLOCKED]
          description: "Whether the account can be used."
    ContactDetailsUpdate:
      type: object
      description: "New contact details for a customer."
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: "New primary email address."
        phone:
          type: string
          description: "New primary phone number."
        address:
          $ref: "#/components/schemas/Address"
    Consent:
      type: object
      description: "A consent granted by a customer."
      required: [consentId, purpose, grantedAt, status]
      properties:
        consentId:
          type: string
          description: "Identifier of the consent."
        purpose:
          type: string
          description: "What the customer agreed to."
        grantedAt:
          type: string
          format: date-time
          description: "When the consent was given."
        expiresAt:
          type: string
          format: date-time
          description: "When the consent stops being valid."
        status:
          type: string
          enum: [ACTIVE, EXPIRED, WITHDRAWN]
          description: "Current state of the consent."
    Problem:
      type: object
      description: "Error body returned for every failed call, with the application/problem+json media type."
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri
          description: "URI that identifies the kind of problem."
        title:
          type: string
          description: "Short, human-readable summary of the problem."
        status:
          type: integer
          description: "HTTP status code of the response."
        code:
          type: string
          description: "Lab Bank error code, for example AUTH-001."
        detail:
          type: string
          description: "Explanation specific to this occurrence of the problem."
        correlationId:
          type: string
          description: "Correlation identifier of the failed call."
