openapi: 3.1.0
info:
  title: Lab Bank Payments API
  version: 1.0.0
  description: "Initiates, reads and cancels payments from a customer account. This is a synthetic specification for a fictional bank, written for a retrieval-augmented generation experiment. Nothing in it describes a real institution."
servers:
  - url: https://api.labbank.example
tags:
  - name: Payments
    description: "Payment instructions."
paths:
  /v1/payments:
    post:
      operationId: initiatePayment
      summary: Initiate a payment
      description: "Creates a payment from one of the customer's accounts to a beneficiary IBAN. The call must carry an Idempotency-Key header so that a retry after a timeout does not create a second payment."
      tags: [Payments]
      security:
        - bearerAuth: ["payments:write"]
          apiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "A UUID chosen by the caller for this payment. Sending the same key again returns the original payment instead of creating another one."
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        description: "The payment to create."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "201":
          description: "The payment was created."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/payments/{paymentId}:
    get:
      operationId: getPayment
      summary: Get a payment
      description: "Returns one payment and its current status."
      tags: [Payments]
      security:
        - bearerAuth: ["payments:write"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The payment."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/payments/{paymentId}/cancellation:
    post:
      operationId: cancelPayment
      summary: Cancel a payment
      description: "Cancels a payment that has not been executed yet. A payment can only be cancelled while its status is PENDING."
      tags: [Payments]
      security:
        - bearerAuth: ["payments:write"]
          apiKey: []
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The payment, now with the status CANCELLED."
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NotCancellable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: oauth2
      description: "OAuth 2.0 access token obtained from the token endpoint with the client credentials grant. The token is sent as `Authorization: Bearer <token>`. Each operation lists the scope it needs."
      flows:
        clientCredentials:
          tokenUrl: https://api.labbank.example/oauth/token
          scopes:
            "customers:read": "Read customer profiles, linked accounts and consents."
            "customers:write": "Change customer contact details."
            "accounts:read": "Read accounts, balances and transactions."
            "statements:read": "Read and request account statements."
            "payments:write": "Initiate, read and cancel payments."
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: "Key identifying the consuming application. It is required on every call in addition to the bearer token."
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: "Optional identifier chosen by the caller to trace a call across systems. It is echoed in the X-Correlation-Id response header and in the Problem correlationId field."
      schema:
        type: string
        maxLength: 64
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: "Identifier of the payment."
      schema:
        type: string
  headers:
    CorrelationId:
      description: "The correlation identifier of the call. It repeats the caller's value, or a generated one when none was sent."
      schema:
        type: string
  responses:
    BadRequest:
      description: "The request is malformed or fails validation. The Problem `code` is `VAL-001`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "The access token is missing, invalid or expired. The Problem `code` is `AUTH-001`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "The access token is valid but does not carry the scope the operation requires. The Problem `code` is `AUTH-002`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "The payment does not exist. The Problem `code` is `PAY-404`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: "Too many requests were sent and the call was refused. The Problem `code` is `RATE-001`. Wait for the number of seconds in the Retry-After header before trying again."
      headers:
        Retry-After:
          description: "Number of seconds to wait before retrying."
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IdempotencyConflict:
      description: "The Idempotency-Key was already used with a different request body. The Problem `code` is `PAY-409`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotCancellable:
      description: "The payment can no longer be cancelled because its status is not PENDING. The Problem `code` is `PAY-410`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Amount:
      type: object
      description: "A monetary amount in a single currency."
      required: [value, currency]
      properties:
        value:
          type: string
          description: "Decimal amount as a string, for example 125.40, to avoid rounding errors."
        currency:
          type: string
          description: "ISO 4217 currency code, for example EUR."
    PaymentRequest:
      type: object
      description: "A payment instruction."
      required: [debtorAccountId, creditorIban, creditorName, amount]
      properties:
        debtorAccountId:
          type: string
          description: "Account the money is taken from."
        creditorIban:
          type: string
          description: "IBAN of the beneficiary."
        creditorName:
          type: string
          description: "Name of the beneficiary."
        amount:
          $ref: "#/components/schemas/Amount"
        reference:
          type: string
          description: "Free-text reference shown to the beneficiary."
        requestedExecutionDate:
          type: string
          format: date
          description: "Date on which the payment should be executed. Defaults to the next possible day."
    Payment:
      type: object
      description: "A payment and its state."
      required: [paymentId, status, debtorAccountId, creditorIban, amount]
      properties:
        paymentId:
          type: string
          description: "Identifier of the payment."
        status:
          type: string
          enum: [PENDING, EXECUTED, REJECTED, CANCELLED]
          description: "Current state of the payment."
        debtorAccountId:
          type: string
          description: "Account the money is taken from."
        creditorIban:
          type: string
          description: "IBAN of the beneficiary."
        creditorName:
          type: string
          description: "Name of the beneficiary."
        amount:
          $ref: "#/components/schemas/Amount"
        reference:
          type: string
          description: "Free-text reference shown to the beneficiary."
        requestedExecutionDate:
          type: string
          format: date
          description: "Date on which the payment should be executed."
        createdAt:
          type: string
          format: date-time
          description: "When the payment was created."
    Problem:
      type: object
      description: "Error body returned for every failed call, with the application/problem+json media type."
      required: [type, title, status, code, detail]
      properties:
        type:
          type: string
          format: uri
          description: "URI that identifies the kind of problem."
        title:
          type: string
          description: "Short, human-readable summary of the problem."
        status:
          type: integer
          description: "HTTP status code of the response."
        code:
          type: string
          description: "Lab Bank error code, for example AUTH-001."
        detail:
          type: string
          description: "Explanation specific to this occurrence of the problem."
        correlationId:
          type: string
          description: "Correlation identifier of the failed call."
