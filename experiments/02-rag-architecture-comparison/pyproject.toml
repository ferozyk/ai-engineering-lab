[project]
name = "rag-architecture-comparison"
version = "0.1.0"
description = "Experiment 02: RAG architecture comparison over synthetic OpenAPI specs."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Feroz Khatri" }]
dependencies = [
    "ai-engineering-lab",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
]

[project.scripts]
rag-experiment = "rag_experiment.cli:main"

[tool.uv.sources]
ai-engineering-lab = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_experiment"]
