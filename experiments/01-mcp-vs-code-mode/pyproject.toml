[project]
name = "mcp-vs-code-mode"
version = "0.1.0"
description = "Experiment 01: MCP tool calling vs Code Mode on a synthetic banking workflow."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Feroz Khatri" }]
dependencies = [
    "ai-engineering-lab",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "openai>=3.42.0",
    "pandas>=3.1.0",
    "pydantic>=2.9",
    "pydantic-monty>=1.4.0",
]

[tool.uv.sources]
ai-engineering-lab = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_vs_code_mode"]
